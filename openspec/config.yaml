schema: spec-driven

rules:
  tasks:
    - "Only implement a single top level task per session"
    - "It's ok to implement all subtasks (example: task 1.1, 1.2, 1.3, etc. are all part of task 1), but never two different top level tasks (example: task 1, 2, 3)"
    - "After finishing a top level task stop execution. The user will review the code implemented in the task and give feedback. Take the feedback and make the adjustments as requested."
