template: testify
template-data:
  unroll-variadic: true
packages:
  github.com/dirodriguezm/xmatch/service/internal/catalog:
    config:
      dir: "{{.InterfaceDir}}"
      filename: "mocks.go"
      structname: "Mock{{.InterfaceName}}"
    interfaces:
      CatalogAdapter:
  github.com/dirodriguezm/xmatch/service/internal/repository:
    config:
      dir: "{{.InterfaceDir}}"
      filename: "mocks.go"
      structname: "Mock{{.InterfaceName}}"
    interfaces:
      MastercatReader:
      MastercatWriter:
  github.com/dirodriguezm/xmatch/service/internal/search/lightcurve:
    config:
      dir: "{{.InterfaceDir}}"
      filename: "mocks.go"
      structname: "Mock{{.InterfaceName}}"
    interfaces:
      ExternalClient:
      ConesearchService:
