version: "2"
sql:
  - engine: "sqlite"
    queries:
      - "catalogs.sql"
      - "mastercat.sql"
      - "allwise.sql"
      - "gaia.sql"
      - "erosita.sql"
    schema: "./migrations"
    gen:
      go:
        package: "repository"
        out: "../repository"
        emit_json_tags: true
        emit_pointers_for_null_types: true
overrides:
  go:
    rename:
      gaium: Gaia
      erositum: Erosita
