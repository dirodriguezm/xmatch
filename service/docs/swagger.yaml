basePath: /v1
definitions:
  api.BulkConesearchRequest:
    properties:
      catalog:
        type: string
      dec:
        items:
          type: number
        type: array
      nneighbor:
        type: integer
      ra:
        items:
          type: number
        type: array
      radius:
        type: number
    type: object
  api.BulkMetadataRequest:
    properties:
      catalog:
        type: string
      ids:
        items:
          type: string
        type: array
    type: object
  api.LightcurveEntry:
    properties:
      catalog:
        type: string
      data:
        type: object
      id:
        type: string
      mag:
        type: number
      magerr:
        type: number
      mjd:
        type: number
      object_id:
        type: string
    type: object
  api.LightcurveResponse:
    properties:
      detections:
        items:
          $ref: '#/definitions/api.LightcurveEntry'
        type: array
      forced_photometry:
        items:
          $ref: '#/definitions/api.LightcurveEntry'
        type: array
      non_detections:
        items:
          $ref: '#/definitions/api.LightcurveEntry'
        type: array
    type: object
  api.ParseError:
    properties:
      ErrValue:
        type: string
      Field:
        type: string
      Reason:
        type: string
    type: object
  conesearch.MastercatExtended:
    properties:
      cat:
        type: string
      dec:
        type: number
      distance:
        type: number
      id:
        type: string
      ipix:
        type: integer
      ra:
        type: number
    type: object
  conesearch.MastercatResult:
    properties:
      catalog:
        type: string
      data:
        items:
          $ref: '#/definitions/conesearch.MastercatExtended'
        type: array
      index:
        type: integer
      total:
        type: integer
      total_in_catalog:
        type: integer
    type: object
  conesearch.ValidationError:
    properties:
      ErrValue:
        type: string
      Field:
        type: string
      Reason:
        type: string
    type: object
  metadata.ValidationError:
    properties:
      Field:
        type: string
      Reason:
        type: string
      Value:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: diegorodriguezmancini@gmail.com
    name: Diego Rodriguez Mancini
  description: API for the CrossWave Xmatch service. This service allows to search
    for objects in a given region and to retrieve metadata from the catalogs.
  title: CrossWave HTTP API
  version: "1.0"
paths:
  /bulk-conesearch:
    post:
      consumes:
      - application/json
      description: Search for objects in a given region using lists of ra, dec and
        a single radius. Radius is in arcseconds. Results are grouped by catalog.
      parameters:
      - description: Bulk conesearch request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BulkConesearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/conesearch.MastercatResult'
            type: array
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/conesearch.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Search for objects in a given region using multiple coordinates
      tags:
      - conesearch
  /bulk-metadata:
    post:
      consumes:
      - application/json
      description: Search for metadata by multiple ids in bulk. The response fields
        depend on the requested catalog (allwise, gaia or erosita) and include the
        catalog-specific columns plus ra and dec.
      parameters:
      - description: Bulk metadata request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BulkMetadataRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Catalog-specific metadata records
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/metadata.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Search for metadata by multiple ids
      tags:
      - metadata
  /conesearch:
    get:
      consumes:
      - application/json
      description: Search for objects in a given region using ra, dec and radius.
        Radius is in arcseconds. Returns mastercat results grouped by catalog, or
        metadata results grouped by catalog when getMetadata is true.
      parameters:
      - description: Right ascension in degrees
        in: query
        name: ra
        required: true
        type: string
      - description: Declination in degrees
        in: query
        name: dec
        required: true
        type: string
      - description: Radius in arcseconds
        in: query
        name: radius
        required: true
        type: string
      - description: 'Catalog to search in (default: all)'
        in: query
        name: catalog
        type: string
      - description: 'Number of neighbors to return (default: 1)'
        in: query
        name: nneighbor
        type: string
      - description: 'Return metadata results instead of mastercat results (default:
          false)'
        in: query
        name: getMetadata
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/conesearch.MastercatResult'
            type: array
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/conesearch.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Search for objects in a given region
      tags:
      - conesearch
  /lightcurve:
    get:
      consumes:
      - application/json
      description: Get lightcurve data for specified coordinates with search radius
        and neighbor count
      parameters:
      - description: Right Ascension coordinate
        in: query
        name: ra
        required: true
        type: string
      - description: Declination coordinate
        in: query
        name: dec
        required: true
        type: string
      - description: Search radius in arcseconds
        in: query
        name: radius
        required: true
        type: string
      - description: 'Catalog to query: all, ztf, neowise or allwise (default: all)'
        in: query
        name: catalog
        type: string
      - description: 'Number of neighbors to return (default: 1)'
        in: query
        name: nneighbor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.LightcurveResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ParseError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get lightcurve data for coordinates
      tags:
      - lightcurve
  /metadata:
    get:
      consumes:
      - application/json
      description: Search for metadata by id. The response fields depend on the requested
        catalog (allwise, gaia or erosita) and include the catalog-specific columns
        plus ra and dec.
      parameters:
      - description: ID to search for
        in: query
        name: id
        required: true
        type: string
      - description: Catalog to search in (allwise, gaia or erosita)
        in: query
        name: catalog
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Catalog-specific metadata record
          schema:
            additionalProperties: true
            type: object
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/metadata.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Search for metadata by id
      tags:
      - metadata
swagger: "2.0"
